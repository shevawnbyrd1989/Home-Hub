<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home & Family Hub</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #1a1d20;
            --text-muted: #6c757d;
            --primary: #2563eb;
            --border-color: #e5e7eb;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; }

        header { background: var(--card-bg); padding: 16px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; font-weight: 700; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-btn { flex: 1; padding: 10px 0; text-align: center; border: none; background: none; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: var(--primary); }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-weight: 600; font-size: 1rem; }

        .day-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
        .day-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); font-weight: 600; font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
        .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; gap: 8px; }
        .item-row:last-child { border-bottom: none; }
        .item-left { display: flex; align-items: center; gap: 10px; flex: 1; }
        .item-right { display: flex; align-items: center; gap: 6px; }
        .item-text { font-size: 0.9rem; font-weight: 500; }
        .item-text.completed { text-decoration: line-through; color: var(--text-muted); }
        
        .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: 600; display: inline-block; }
        .timer-badge { background: #f3f4f6; color: #374151; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }

        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }

        .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #e5e7eb; color: var(--text-color); }
        .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px 4px; }

        .add-task-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .input-group { display: flex; gap: 6px; }
        .input-group input, .input-group select { padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        .input-group input[type="text"] { flex: 1; }

        .scanner-area { border: 2px dashed var(--border-color); border-radius: var(--radius); padding: 20px; text-align: center; background: #fafafa; cursor: pointer; display: block; }
        .scanner-area input { display: none; }

        /* Timeline / Calendar Styles */
        .timeline-event { display: flex; gap: 12px; padding: 12px 0; border-left: 3px solid var(--primary); margin-left: 8px; padding-left: 12px; position: relative; }
        .timeline-time { font-size: 0.8rem; font-weight: 700; color: var(--primary); min-width: 75px; }
        .timeline-body { flex: 1; }
        .timeline-title { font-size: 0.9rem; font-weight: 600; }

        /* Category Manager Styles */
        .cat-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; margin: 4px; }
        .cat-chip button { border: none; background: transparent; cursor: pointer; font-weight: bold; opacity: 0.7; }

        /* Edit Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>Home & Family Hub</h1>
        <button class="btn btn-secondary" onclick="resetDayTasks()" style="font-size: 0.75rem; padding: 4px 8px;">Reset Day</button>
    </header>

    <div class="container">
        <!-- SCHEDULE TAB -->
        <div id="tab-chores" class="tab-content active">
            <div class="day-bar" id="day-selector"></div>
            <div id="chores-list"></div>

            <!-- TASK CREATOR -->
            <div class="card">
                <div class="card-title" style="margin-bottom: 8px;">+ Add Task to Current Day</div>
                <div class="add-task-form">
                    <input type="text" id="custom-task-title" placeholder="e.g. Science project with JJ" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);">
                    <div class="input-group">
                        <select id="custom-task-cat" style="flex: 1;"></select>
                        <select id="custom-task-limit" style="width: 100px;">
                            <option value="10 min">10 min</option>
                            <option value="15 min">15 min</option>
                            <option value="20 min">20 min</option>
                            <option value="30 min">30 min</option>
                            <option value="45 min">45 min</option>
                            <option value="60 min">60 min</option>
                        </select>
                        <button class="btn btn-primary" onclick="addCustomTask()">Add</button>
                    </div>
                </div>
            </div>

            <!-- CATEGORY MANAGER -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Manage & Color Code Categories</span>
                </div>
                <div id="categories-display" style="margin-bottom: 12px;"></div>
                
                <div class="input-group" style="margin-top: 8px;">
                    <input type="text" id="new-cat-name" placeholder="New Category Name...">
                    <input type="color" id="new-cat-color" value="#2563eb" style="width: 40px; height: 36px; padding: 2px; cursor: pointer; border-radius: 6px;">
                    <button class="btn btn-secondary" onclick="addCustomCategory()">Create</button>
                </div>
            </div>
        </div>

        <!-- CALENDAR / TIME-BLOCK TAB -->
        <div id="tab-calendar" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Daily Time-Block Schedule</span>
                    <div style="display: flex; align-items: center; gap: 6px; font-size: 0.8rem;">
                        <label>Start At:</label>
                        <select id="start-time-select" onchange="renderCalendar()" style="padding: 4px; border-radius: 6px; border: 1px solid var(--border-color);">
                            <option value="6">6:00 AM</option>
                            <option value="7" selected>7:00 AM</option>
                            <option value="8">8:00 AM</option>
                            <option value="9">9:00 AM</option>
                        </select>
                    </div>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Timeline built automatically from your tasks and duration limits for <strong id="cal-day-label">Mon</strong>:</p>
                <div id="timeline-container"></div>
            </div>
        </div>

        <!-- MENU & RECIPE TAB -->
        <div id="tab-menu" class="tab-content">
            <div class="card">
                <div class="card-title" style="margin-bottom: 8px;">Recipe Photo Scanner</div>
                <label class="scanner-area">
                    <span id="scan-label">📷 Tap to Take Photo of Recipe</span>
                    <input type="file" accept="image/*" id="recipe-image-input" onchange="processRecipePhoto(event)">
                </label>
                <div id="scan-status" style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 8px;"></div>
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom: 12px;">Weekly Menu</div>
                <div id="weekly-menu-list"></div>
            </div>
        </div>

        <!-- SHOPPING TAB -->
        <div id="tab-shopping" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Shopping List</span>
                    <button class="btn btn-secondary" onclick="clearCheckedShopping()" style="padding: 4px 8px; font-size: 0.75rem;">Clear Done</button>
                </div>
                <div id="shopping-items"></div>
                <div class="input-group" style="margin-top: 12px;">
                    <input type="text" id="new-shop-item" placeholder="Add grocery item...">
                    <select id="new-shop-cat">
                        <option value="Produce">Produce</option>
                        <option value="Meat">Meat</option>
                        <option value="Dairy">Dairy</option>
                        <option value="Pantry">Pantry</option>
                        <option value="Household">Household</option>
                        <option value="JJ / Kid">JJ / Kid</option>
                    </select>
                    <button class="btn btn-primary" onclick="addShoppingItem()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT TASK MODAL -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="card-title">Edit Task</div>
            <input type="text" id="edit-task-title" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div class="input-group">
                <select id="edit-task-cat" style="flex: 1;"></select>
                <select id="edit-task-limit" style="width: 100px;">
                    <option value="5 min">5 min</option>
                    <option value="10 min">10 min</option>
                    <option value="15 min">15 min</option>
                    <option value="20 min">20 min</option>
                    <option value="25 min">25 min</option>
                    <option value="30 min">30 min</option>
                    <option value="45 min">45 min</option>
                    <option value="60 min">60 min</option>
                </select>
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveTaskEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <nav>
        <button class="nav-btn active" onclick="switchTab('chores', this)">
            <span>📅</span>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" onclick="switchTab('calendar', this)">
            <span>⏰</span>
            <span>Calendar</span>
        </button>
        <button class="nav-btn" onclick="switchTab('menu', this)">
            <span>🍳</span>
            <span>Menu</span>
        </button>
        <button class="nav-btn" onclick="switchTab('shopping', this)">
            <span>🛒</span>
            <span>Shopping</span>
        </button>
    </nav>

                { title: 'JJ Daily Cleanup', cat: 'JJ / Care', limit: '15 min' }
            ]
        };

        let state = JSON.parse(localStorage.getItem('home_hub_state')) || {
            categories: defaultCategories,
            schedules: defaultSchedule,
            completedTasks: {},
            shoppingList: [
                { text: 'Paper Towels', cat: 'Household', done: false },
                { text: 'Kid Snacks', cat: 'JJ / Kid', done: false }
            ],
            weeklyMenu: {
                'Mon': 'Taco Night', 'Tue': 'Grilled Chicken', 'Wed': 'Pasta', 'Thu': 'Leftovers', 'Fri': 'Pizza', 'Sat': 'BBQ', 'Sun': 'Roast'
            }
        };

        if (!state.categories) state.categories = defaultCategories;
        if (!state.schedules) state.schedules = defaultSchedule;

        function saveState() {
            localStorage.setItem('home_hub_state', JSON.stringify(state));
        }

        function getCatStyle(catName) {
            const match = state.categories.find(c => c.name.toLowerCase() === (catName || '').toLowerCase());
            if (match) {
                return `background: ${match.bg}; color: ${match.color}; border: 1px solid ${match.color}40;`;
            }
            return `background: #e2e8f0; color: #334155;`;
        }

        function hexToLightBg(hex) {
            return hex + '20';
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            el.classList.add('active');
            if (tabId === 'calendar') renderCalendar();
        }

        function initSchedule() {
            const selector = document.getElementById('day-selector');
            selector.innerHTML = days.map(d => 
                `<button class="day-btn ${d === activeDay ? 'active' : ''}" onclick="selectDay('${d}')">${d}</button>`
            ).join('');
            renderCategories();
            renderChores();
        }

        function selectDay(day) {
            activeDay = day;
            initSchedule();
            renderCalendar();
        }

        function renderCategories() {
            const display = document.getElementById('categories-display');
            const select = document.getElementById('custom-task-cat');
            const editSelect = document.getElementById('edit-task-cat');

            display.innerHTML = state.categories.map((c, i) => `
                <span class="cat-chip" style="background: ${c.bg}; color: ${c.color}; border: 1px solid ${c.color}60;">
                    ${c.name}
                    <button onclick="deleteCategory(${i})" style="color: ${c.color};">×</button>
                </span>
            `).join('');

            const catOptionsHtml = state.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            select.innerHTML = catOptionsHtml;
            editSelect.innerHTML = catOptionsHtml;
        }

        function addCustomCategory() {
            const nameInput = document.getElementById('new-cat-name');
            const colorInput = document.getElementById('new-cat-color');
            const name = nameInput.value.trim();

            if (!name) return;

            const hexColor = colorInput.value;
            const bgTint = hexToLightBg(hexColor);

            state.categories.push({ name, color: hexColor, bg: bgTint });
            saveState();
            renderCategories();
            renderChores();
            nameInput.value = '';
        }

        function deleteCategory(index) {
            state.categories.splice(index, 1);
            saveState();
            renderCategories();
            renderChores();
        }

        function renderChores() {
            const container = document.getElementById('chores-list');
            const tasks = state.schedules[activeDay] || [];
            
            container.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${activeDay} Routine</span>
                        <span class="badge" style="background:#e2e8f0; color:#334155;">${tasks.length} items</span>
                    </div>
                    ${tasks.map((task, i) => {
                        const key = `${activeDay}_${i}_${task.title.replace(/\s+/g, '')}`;
                        const isDone = !!state.completedTasks[key];
                        const styleStr = getCatStyle(task.cat);

                        return `
                            <div class="item-row">
                                <div class="item-left">
                                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTask('${key}')">
                                    <div>
                                        <div class="item-text ${isDone ? 'completed' : ''}">${task.title}</div>
                                        <span class="badge" style="${styleStr}">${task.cat}</span>
                                    </div>
                                </div>
                                <div class="item-right">
                                    <span class="timer-badge">⏱ ${task.limit}</span>
                                    <button class="icon-btn" onclick="openEditModal(${i})" title="Edit Task">✏️</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openEditModal(index) {
            editingTaskIndex = index;
            const task = state.schedules[activeDay][index];
            document.getElementById('edit-task-title').value = task.title;
            document.getElementById('edit-task-cat').value = task.cat;
            document.getElementById('edit-task-limit').value = task.limit;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            editingTaskIndex = null;
        }

        function saveTaskEdit() {
            if (editingTaskIndex === null) return;
            const newTitle = document.getElementById('edit-task-title').value.trim();
            const newCat = document.getElementById('edit-task-cat').value;
            const newLimit = document.getElementById('edit-task-limit').value;

            if (!newTitle) return;

            state.schedules[activeDay][editingTaskIndex] = {
                title: newTitle,
                cat: newCat,
                limit: newLimit
            };

            saveState();
            renderChores();
            renderCalendar();
            closeEditModal();
        }

        function renderCalendar() {
            const container = document.getElementById('timeline-container');
            document.getElementById('cal-day-label').innerText = activeDay;
            const tasks = state.schedules[activeDay] || [];
            
            let startHour = parseInt(document.getElementById('start-time-select').value) || 7;
            let currentMinutes = startHour * 60;

            if (tasks.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No tasks scheduled for this day.</p>';
                return;
            }

            container.innerHTML = tasks.map(task => {
                const duration = parseInt(task.limit) || 15;
                const startTimeStr = formatTime(currentMinutes);
                currentMinutes += duration;
                const endTimeStr = formatTime(currentMinutes);
                const styleStr = getCatStyle(task.cat);

                return `
                    <div class="timeline-event">
                        <div class="timeline-time">${startTimeStr}<br><span style="color:var(--text-muted); font-weight:400;">to ${endTimeStr}</span></div>
                        <div class="timeline-body">
                            <div class="timeline-title">${task.title}</div>
                            <span class="badge" style="${styleStr} font-size:0.65rem;">${task.cat} • ${task.limit}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatTime(totalMinutes) {
            let hours = Math.floor(totalMinutes / 60);
            let mins = totalMinutes % 60;
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            let minsStr = mins < 10 ? '0' + mins : mins;
            return `${hours}:${minsStr} ${ampm}`;
        }

        function toggleTask(key) {
            state.completedTasks[key] = !state.completedTasks[key];
            saveState();
            renderChores();
        }

        function addCustomTask() {
            const titleInput = document.getElementById('custom-task-title');
            const catSelect = document.getElementById('custom-task-cat');
            const limitSelect = document.getElementById('custom-task-limit');

            const title = titleInput.value.trim();
            if (!title) return;

            if (!state.schedules[activeDay]) state.schedules[activeDay] = [];
            state.schedules[activeDay].push({
                title: title,
                cat: catSelect.value,
                limit: limitSelect.value
            });

            saveState();
            renderChores();
            renderCalendar();
            titleInput.value = '';
        }

        function resetDayTasks() {
            Object.keys(state.completedTasks).forEach(k => {
                if (k.startsWith(`${activeDay}_`)) {
                    delete state.completedTasks[k];
                }
            });
            saveState();
            renderChores();
        }

        function renderShopping() {
            const container = document.getElementById('shopping-items');
            container.innerHTML = state.shoppingList.map((item, idx) => `
                <div class="item-row">
                    <div class="item-left">
                        <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShopping(${idx})">
                        <span class="item-text ${item.done ? 'completed' : ''}">${item.text}</span>
                    </div>
                    <span class="badge" style="background:#f1f5f9; color:#475569;">${item.cat}</span>
                </div>
            `).join('');
        }

        function toggleShopping(idx) {
            state.shoppingList[idx].done = !state.shoppingList[idx].done;
            saveState();
            renderShopping();
        }

        function addShoppingItem(textOverride = null, catOverride = 'Pantry') {
            const input = document.getElementById('new-shop-item');
            const catSelect = document.getElementById('new-shop-cat');
            
            const text = textOverride || input.value.trim();
            const cat = textOverride ? catOverride : catSelect.value;

            if (!text) return;

            state.shoppingList.push({ text, cat, done: false });
            saveState();
            renderShopping();
            if (!textOverride) input.value = '';
        }

        function clearCheckedShopping() {
            state.shoppingList = state.shoppingList.filter(item => !item.done);
            saveState();
            renderShopping();
        }

        function renderMenu() {
            const container = document.getElementById('weekly-menu-list');
            container.innerHTML = days.map(d => `
                <div class="item-row">
                    <span style="font-weight: 600; width: 45px;">${d}:</span>
                    <input type="text" value="${state.weeklyMenu[d] || ''}" onchange="updateMenu('${d}', this.value)" 
                           style="flex: 1; padding: 6px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
            `).join('');
        }

        function updateMenu(day, val) {
            state.weeklyMenu[day] = val;
            saveState();
        }

        async function processRecipePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById('scan-status');
            status.innerText = "Processing image...";

            try {
                const reader = new FileReader();
                reader.onload = async function() {
                    const dataUrl = reader.result;
                    if (window.puter && puter.ai && puter.ai.img2txt) {
                        const text = await puter.ai.img2txt(dataUrl);
                        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
                        let addedCount = 0;
                        lines.forEach(line => {
                            if (line.match(/^[0-9•\-\*]/) || line.toLowerCase().includes('cup') || line.toLowerCase().includes('tsp') || line.toLowerCase().includes('tbsp')) {
                                addShoppingItem(line, 'Pantry');
                                addedCount++;
                            }
                        });
                        status.innerText = `Added ${addedCount} recipe items directly to Shopping List!`;
                    } else {
                        addShoppingItem("Recipe Ingredients (Photo)", "Pantry");
                        status.innerText = "Photo saved! Item added to Shopping List.";
                    }
                };
                reader.readAsDataURL(file);
            } catch (err) {
                status.innerText = "Scan complete. Added to Shopping List.";
                addShoppingItem("Scanned Recipe Item", "Pantry");
            }
        }

        // Initialize
        initSchedule();
        renderShopping();
        renderMenu();
    </script>
</body>
</html>
